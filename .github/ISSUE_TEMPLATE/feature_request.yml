name: Feature request
description: Suggest a project-neutral addition or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Please keep proposals project-neutral and explain privacy/security impact."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring platform problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Privacy, security and compatibility impact
    validations:
      required: true
