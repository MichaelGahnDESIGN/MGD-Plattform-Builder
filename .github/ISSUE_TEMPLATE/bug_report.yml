name: Bug report
description: Report a reproducible problem in the foundation, schema, template or documentation.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve the foundation. Do not include secrets or personal data."
  - type: input
    id: version
    attributes:
      label: Foundation version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Schema
        - Agent skill
        - Privacy
        - Security
        - Compliance
        - Operations
        - Domain pack
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use generic/synthetic data only.
    validations:
      required: true
