name: Import existing GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/project-wiki
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/project-wiki

      - name: Copy wiki into source folder
        run: |
          rm -rf wiki
          mkdir -p wiki
          find /tmp/project-wiki -maxdepth 1 -type f ! -name ".git*" -exec cp {} wiki/ \;

      - name: Commit imported wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki
          if git diff --cached --quiet; then
            echo "No wiki changes to import."
          else
            git commit -m "docs: import existing GitHub wiki"
            git push
          fi
