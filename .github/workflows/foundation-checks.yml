name: Foundation Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run foundation checks
        run: npm run check

      - name: Smoke test project bootstrap
        run: |
          rm -rf /tmp/mgd-platform-smoke
          node ./bin/mgd-platform.js init --preset game --target /tmp/mgd-platform-smoke
          node ./bin/mgd-platform.js doctor /tmp/mgd-platform-smoke
