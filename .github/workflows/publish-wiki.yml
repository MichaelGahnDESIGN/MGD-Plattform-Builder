name: Publish GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-wiki
  cancel-in-progress: true

jobs:
  publish-wiki:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone GitHub wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/project-wiki
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/project-wiki

      - name: Mirror wiki source
        run: |
          rsync -a --delete --exclude=".git/" wiki/ /tmp/project-wiki/

      - name: Publish changes
        working-directory: /tmp/project-wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: publish wiki from main repository"
          git push
