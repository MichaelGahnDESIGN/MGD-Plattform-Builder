version: "0.5.1"

conventions:
  format: "<domain>.<resource>.<action>"
  notes:
    - "Use lowercase dot-separated identifiers."
    - "Capabilities authorize actions. Roles only bundle capabilities."
    - "High-risk capabilities should normally generate audit events."

capabilities:
  content.read:
    group: content
    risk: low
    audit: false

  content.publish:
    group: content
    risk: medium
    audit: true

  moderation.case.read:
    group: moderation
    risk: medium
    audit: false

  moderation.case.decide:
    group: moderation
    risk: high
    audit: true
    reauthentication: false

  support.case.read:
    group: support
    risk: medium
    audit: true

  privacy.request.manage:
    group: privacy
    risk: high
    audit: true
    reauthentication: true

  translations.publish:
    group: translations
    risk: medium
    audit: true

  security.audit.read:
    group: security
    risk: high
    audit: true
    reauthentication: true

  permissions.manage:
    group: security
    risk: critical
    audit: true
    reauthentication: true

  accounts.suspend:
    group: accounts
    risk: high
    audit: true
    reauthentication: true

  translations.read:
    group: translations
    risk: low
    audit: false

  translations.manage:
    group: translations
    risk: medium
    audit: true

  service-principals.read:
    group: security
    risk: high
    audit: true
    reauthentication: true

  service-principals.manage:
    group: security
    risk: critical
    audit: true
    reauthentication: true

  jobs.read:
    group: operations
    risk: medium
    audit: false

  jobs.manage:
    group: operations
    risk: high
    audit: true

  translations.review:
    group: translations
    risk: medium
    audit: true

  translations.import:
    group: translations
    risk: medium
    audit: true

  translations.export:
    group: translations
    risk: low
    audit: true

  # 0.5.1 mandatory CMS features
  cms.pages.read:
    group: cms
    risk: low
    audit: false

  cms.pages.manage:
    group: cms
    risk: medium
    audit: true

  cms.pages.delete:
    group: cms
    risk: high
    audit: true

  cms.pages.import:
    group: cms
    risk: high
    audit: true

  cms.pages.export:
    group: cms
    risk: medium
    audit: true

  release-notes.manage:
    group: cms
    risk: low
    audit: true

  credits.manage:
    group: cms
    risk: low
    audit: true

  settings.read:
    group: system
    risk: low
    audit: false

  settings.manage:
    group: system
    risk: high
    audit: true

  design.manage:
    group: system
    risk: medium
    audit: true

  code-editor.assets.manage:
    group: system
    risk: high
    audit: true
    reauthentication: true

  code-editor.server.manage:
    group: system
    risk: critical
    audit: true
    reauthentication: true

  # Backup module of the PHP/MySQL starter (modules/backup). The starter maps all of them to the administration role.
  backup.read:
    group: operations
    risk: medium
    audit: false
    description: "View backup status, history and fingerprints; never keys or credentials."

  backup.run:
    group: operations
    risk: medium
    audit: true
    description: "Queue or cancel a backup run."

  backup.download:
    group: operations
    risk: high
    audit: true
    description: "Download an encrypted backup part through the authenticated endpoint."

  backup.settings.manage:
    group: operations
    risk: high
    audit: true
    reauthentication: true
    description: "Change public keys, destinations, schedule, retention, file areas and the cron token."

  backup.delete:
    group: operations
    risk: high
    audit: true
    reauthentication: true
    description: "Delete stored backups locally or at destinations."

  backup.restore:
    group: operations
    risk: critical
    audit: true
    reauthentication: true
    description: "Restore a backup. Command line only, never through the web; the private key stays off the server."
