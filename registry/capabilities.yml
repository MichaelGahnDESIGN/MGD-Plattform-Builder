version: "0.5.1"

conventions:
  format: "<domain>.<resource>.<action>"
  notes:
    - "Use lowercase dot-separated identifiers."
    - "Capabilities authorize actions. Roles only bundle capabilities."
    - "High-risk capabilities should normally generate audit events."

capabilities:
  content.read:
    group: content
    risk: low
    audit: false

  content.publish:
    group: content
    risk: medium
    audit: true

  moderation.case.read:
    group: moderation
    risk: medium
    audit: false

  moderation.case.decide:
    group: moderation
    risk: high
    audit: true
    reauthentication: false

  support.case.read:
    group: support
    risk: medium
    audit: true

  privacy.request.manage:
    group: privacy
    risk: high
    audit: true
    reauthentication: true

  translations.publish:
    group: translations
    risk: medium
    audit: true

  security.audit.read:
    group: security
    risk: high
    audit: true
    reauthentication: true

  permissions.manage:
    group: security
    risk: critical
    audit: true
    reauthentication: true

  accounts.suspend:
    group: accounts
    risk: high
    audit: true
    reauthentication: true

  translations.read:
    group: translations
    risk: low
    audit: false

  translations.manage:
    group: translations
    risk: medium
    audit: true

  service-principals.read:
    group: security
    risk: high
    audit: true
    reauthentication: true

  service-principals.manage:
    group: security
    risk: critical
    audit: true
    reauthentication: true

  jobs.read:
    group: operations
    risk: medium
    audit: false

  jobs.manage:
    group: operations
    risk: high
    audit: true

  translations.review:
    group: translations
    risk: medium
    audit: true

  translations.import:
    group: translations
    risk: medium
    audit: true

  translations.export:
    group: translations
    risk: low
    audit: true

  # 0.5.1 mandatory CMS features
  cms.pages.read:
    group: cms
    risk: low
    audit: false

  cms.pages.manage:
    group: cms
    risk: medium
    audit: true

  cms.pages.delete:
    group: cms
    risk: high
    audit: true

  cms.pages.import:
    group: cms
    risk: high
    audit: true

  cms.pages.export:
    group: cms
    risk: medium
    audit: true

  release-notes.manage:
    group: cms
    risk: low
    audit: true

  credits.manage:
    group: cms
    risk: low
    audit: true

  settings.read:
    group: system
    risk: low
    audit: false

  settings.manage:
    group: system
    risk: high
    audit: true

  design.manage:
    group: system
    risk: medium
    audit: true

  code-editor.assets.manage:
    group: system
    risk: high
    audit: true
    reauthentication: true

  code-editor.server.manage:
    group: system
    risk: critical
    audit: true
    reauthentication: true
