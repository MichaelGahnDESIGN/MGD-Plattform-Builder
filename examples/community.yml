project:
  name: "Example Community"
  type: "community"
  foundation_version: "0.1.0"
market:
  countries: ["DE"]
languages:
  default: "de"
  enabled: ["de"]
  prepared: ["en"]
features:
  accounts: true
  moderation: true
  support: true
  public_profiles: true
  notifications: true
  translations: true
privacy:
  personal_data: true
  data_subject_portal: true
  retention_policy: true
  dpia_screening: true
security:
  mfa_privileged: true
  audit_log: true
  security_events: true
infrastructure:
  docker: true
  staging: "local"
  git_source: "github"
  backup: "local"
  monitoring: true
