project:
  name: "Example Game"
  type: "game"
  foundation_version: "0.1.0"
market:
  countries: ["DE"]
languages:
  default: "de"
  enabled: ["de"]
  prepared: ["en"]
features:
  accounts: true
  moderation: true
  support: true
  billing: true
  uploads: false
  notifications: true
  store: true
  analytics: true
  ai_agents: true
privacy:
  personal_data: true
  retention_policy: true
  dpia_screening: true
security:
  mfa_privileged: true
  audit_log: true
  security_events: true
  incident_response: true
infrastructure:
  docker: true
  staging: "local"
  git_source: "github"
  backup: "hybrid"
  monitoring: true
release_gates:
  - "anti-abuse-reviewed"
  - "payment-flow-tested"
  - "restore-tested"
