project:
  name: "Example Platform"
  type: "general"
  foundation_version: "0.2.0"
market:
  countries: ["DE"]
languages:
  default: "de"
  enabled: ["de"]
  prepared: ["en"]
features:
  accounts: true
  moderation: true
  support: true
  billing: false
  uploads: true
  cms: true
  translations: true
  ai_agents: true
privacy:
  personal_data: true
  data_subject_portal: true
  retention_policy: true
security:
  mfa_privileged: true
  audit_log: true
  security_events: true
infrastructure:
  docker: true
  staging: "local"
  git_source: "github"
  backup: "local"
  monitoring: true
backoffice:
  enabled: true
  shared_shell: true
  default_route: "/backoffice"
  role_views:
    - id: "admin"
      label: "Administration"
      actor_types: ["human"]
      roles: ["admin"]
      landing: "/backoffice"
      navigation_groups: ["dashboard", "content", "users", "system"]
    - id: "moderation"
      label: "Moderation"
      actor_types: ["human"]
      roles: ["moderator"]
      landing: "/backoffice/moderation"
      navigation_groups: ["dashboard", "moderation"]
    - id: "support"
      label: "Support"
      actor_types: ["human"]
      roles: ["support"]
      landing: "/backoffice/support"
      navigation_groups: ["dashboard", "support"]

agents:
  enabled: true
  read_project_rules_first: true
  production_changes_require_approval: true
  skills:
    - "dev"
    - "todo"
    - "backup"
release_gates:
  - "privacy-reviewed"
  - "security-reviewed"
  - "restore-tested"
