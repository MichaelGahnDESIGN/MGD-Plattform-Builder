project:
  name: "Example Platform"
  type: "general"
  foundation_version: "0.2.0"
market:
  countries: ["DE"]
languages:
  default: "de"
  enabled: ["de"]
  prepared: ["en"]
features:
  accounts: true
  moderation: true
  support: true
  billing: false
  uploads: true
  cms: true
  translations: true
  ai_agents: true
privacy:
  personal_data: true
  data_subject_portal: true
  retention_policy: true
security:
  mfa_privileged: true
  audit_log: true
  security_events: true
infrastructure:
  docker: true
  staging: "local"
  git_source: "github"
  backup: "local"
  monitoring: true
agents:
  enabled: true
  read_project_rules_first: true
  production_changes_require_approval: true
  skills:
    - "dev"
    - "todo"
    - "backup"
release_gates:
  - "privacy-reviewed"
  - "security-reviewed"
  - "restore-tested"
