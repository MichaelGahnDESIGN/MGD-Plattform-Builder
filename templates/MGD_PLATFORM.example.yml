project:
  name: "Example Platform"
  type: "general"
  foundation_version: "0.6.0"
  description: "Project-neutral example profile"
  public_repository: false

market:
  countries:
    - "DE"
  planned_countries:
    - "AT"

languages:
  default: "de"
  enabled:
    - "de"
  prepared:
    - "en"

stack:
  backend: "choose-per-project"
  database: "choose-per-project"
  frontend: "choose-per-project"
  client: "web"
  hosting: "self-hosted-or-managed"

features:
  accounts: true
  organizations: false
  moderation: false
  support: true
  billing: false
  uploads: false
  cms: true
  translations: true
  public_profiles: false
  notifications: true
  store: false
  themes: false
  plugins: true
  analytics: true
  ai_agents: true

privacy:
  personal_data: true
  sensitive_data: false
  data_subject_portal: true
  retention_policy: true
  dpia_screening: true

compliance:
  packs:
    - "DE"
    - "EU"
  legal_library: true
  review_required_before_public_launch: true

security:
  mfa_privileged: true
  audit_log: true
  security_events: true
  secret_management: true
  incident_response: true

infrastructure:
  docker: true
  staging: "local"
  git_source: "github"
  git_mirror: null
  backup: "local"
  monitoring: true

backoffice:
  enabled: true
  shared_shell: true
  default_route: "/backoffice"
  role_views:
    - id: "admin"
      label: "Administration"
      actor_types:
        - "human"
      roles:
        - "admin"
      landing: "/backoffice"
      navigation_groups:
        - "dashboard"
        - "content"
        - "users"
        - "system"
    - id: "moderation"
      label: "Moderation"
      actor_types:
        - "human"
      roles:
        - "moderator"
      landing: "/backoffice/moderation"
      navigation_groups:
        - "dashboard"
        - "moderation"
        - "support"
    - id: "ai-ops"
      label: "AI Operations"
      actor_types:
        - "human"
      roles:
        - "admin"
      landing: "/backoffice/ai"
      navigation_groups:
        - "ai"
        - "audit"

agents:
  enabled: true
  read_project_rules_first: true
  production_changes_require_approval: true
  skills:
    - "dev"
    - "todo"
    - "backup"

release_gates:
  - "privacy-reviewed"
  - "security-reviewed"
  - "backup-tested"
  - "rollback-documented"

versioning:
  source_file: "version.json"
  current: "0.0.1"
  status: "pre-alpha"
  display:
    enabled: true
    show_status: true
    audience: "both"
    locations:
      - "login"
      - "settings"
      - "backoffice_footer"
      - "public_footer"
  release_notes:
    enabled: true
    source_file: "release-notes.json"
    public_audiences:
      - "frontend"
    settings_menu_label: "Release Notes"

cms:
  editor: "tinymce"
  editor_delivery: "local"
  revisions: true
  import_export: true
  trash: true
  custom_pages: true
  legal_pages:
    - "contact"
    - "imprint"
    - "privacy"
    - "cookies"
    - "cookie_banner"
    - "accessibility"
    - "ai_philosophy"
    - "credits"

credits:
  enabled: true
  people: true
  components: true
  editable_in_backoffice: true
  local_assets_only: true

settings:
  searchable: true
  filterable: true

appearance:
  modes:
    - "light"
    - "dark"
  default_mode: "system"
  toggle:
    enabled: true
    locations:
      - "header"
      - "settings"
  design_tokens_editable: true
  design_tokens:
    primary: "#4f46e5"
    secondary: "#0ea5e9"
    accent: "#f59e0b"

file_locations:
  documented_in_backoffice: true
  paths:
    version: "version.json"
    release_notes: "release-notes.json"
    uploads: "public/uploads"
    backups: "storage/backups"
    logs: "storage/logs"

code_editors:
  enabled: true
  languages:
    - "css"
    - "js"
  php_requires_config_flag: true
  backup_before_save: true

experience:
  updater: false
  loading_screen: true
  seo: true
  cookie_banner: true
  maintenance_mode: true
  error_pages: true

template:
  id: "php-mysql-starter"
  variants:
    - "light"
    - "dark"
  databases:
    core: "mysql"
    private: "mysql"
  deployment: "ftps"

briefing:
  completed: true
  completed_at: "2026-09-25"
  accepted_recommendations:
    - "mgd-dev-skill"
    - "mgd-todo-skill"
