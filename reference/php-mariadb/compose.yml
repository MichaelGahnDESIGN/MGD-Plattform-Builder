services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: mgd_platform
      MARIADB_USER: mgd
      MARIADB_PASSWORD: mgd-local-only
      MARIADB_ROOT_PASSWORD: mgd-root-local-only
    ports:
      - "3306:3306"
    volumes:
      - mgd_reference_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mgd_reference_db:
